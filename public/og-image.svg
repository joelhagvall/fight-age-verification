  <text x="158" y="171" text-anchor="middle" font-size="42" font-weight="700" fill="#ffffff">ID</text>
  <text x="112" y="294" font-size="76" font-weight="700" fill="#0a0a0a">Say no to ID checks online.</text>
  <text x="112" y="370" font-size="34" font-weight="500" fill="#525252">Protect children without making the web depend on identity checks.</text>
  <text x="112" y="475" font-size="30" font-weight="700" fill="#0a0a0a">Fight Age Verification</text>
  <text x="112" y="516" font-size="24" font-weight="500" fill="#737373">Choose representatives. Review the email. Make your voice heard.</text>
</svg>
