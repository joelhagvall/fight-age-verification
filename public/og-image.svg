<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="56" y="56" width="1088" height="518" rx="32" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <image href="logo-eu-proposal.png" x="112" y="126" width="228" height="232" preserveAspectRatio="xMidYMid meet"/>
  <text x="400" y="174" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#171717">Fight Age Verification</text>
  <text x="400" y="272" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0a0a0a">The internet should</text>
  <text x="400" y="348" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0a0a0a">not require ID.</text>
  <text x="400" y="426" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#525252">Make your voice heard against mandatory age checks</text>
  <text x="400" y="468" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#525252">and ID requirements online.</text>
  <text x="112" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#171717">fightageverification.com</text>
</svg>
