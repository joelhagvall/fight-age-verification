name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.3.11'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 2

      - id: filter
        name: Detect E2E-relevant changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="${{ github.event.before }}"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --deepen=100 origin "${{ github.ref }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
          if echo "$changed_files" | grep -E '^(src|e2e|public|scripts|\.github/actions/|\.github/workflows/ci\.yml|package\.json|bun\.lock|playwright\.config\.|vite\.config\.|tsconfig|vitest\.config\.)' >/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build app
        run: bun run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run unit tests
        run: bun run test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-unit
          path: test-results/
          retention-days: 7

  a11y:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium webkit

      - name: Run accessibility suite
        run: bun run test:a11y -- --reporter=list,junit,html
        env:
          CI: 'true'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: 'test-results/junit-a11y.xml'

      - name: Upload accessibility test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-a11y
          path: test-results/
          retention-days: 7

      - name: Upload Playwright accessibility report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium webkit

      - name: Run E2E suite
        run: bun run test:e2e -- e2e/campaign.spec.ts --reporter=list,junit,html
        env:
          CI: 'true'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: 'test-results/junit-e2e.xml'

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-e2e
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-bun-project
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run Lighthouse quality gate
        run: bun run test:lighthouse
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  test-results:
    runs-on: ubuntu-latest
    needs: [unit-test, a11y, e2e]
    if: always()
    steps:
      - name: Download all test results
        id: download-test-results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: test-results
          pattern: test-results-*
          merge-multiple: true

      - name: Check for test reports
        id: test-report-files
        shell: bash
        run: |
          if find test-results -name 'junit-*.xml' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Test Results
        if: steps.test-report-files.outputs.found == 'true'
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: 'test-results/junit-*.xml'
          check_name: 'Test Results'
          comment_mode: always
          report_individual_runs: true
